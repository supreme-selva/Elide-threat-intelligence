name: Update Blocklist

on:
  # Rebuild when the engine or the workflow itself changes (lets you watch it
  # work immediately). Doc-only pushes are ignored to save Actions minutes.
  push:
    branches: [main]
    paths:
      - "process_lists.py"
      - ".github/workflows/update.yml"
  schedule:
    # Every day at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

# Least-privilege token: only what git-auto-commit-action needs to push.
permissions:
  contents: write

# Never let two builds race to commit the same file.
concurrency:
  group: blocklist-update
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build merged blocklist
        run: python process_lists.py

      - name: Commit and push updated blocklist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated blocklist update"
          file_pattern: "final_blocklist.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
