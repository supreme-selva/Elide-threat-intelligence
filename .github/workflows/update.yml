name: Update Blocklist

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: {}

# Required so git-auto-commit-action can push the regenerated list back.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build merged blocklist
        run: python process_lists.py

      - name: Commit and push updated blocklist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated blocklist update"
          file_pattern: "final_blocklist.txt"
